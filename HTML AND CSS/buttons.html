<STYLE>
.subscribe-button{
  background-color: rgb(200, 0,0);
   color:white; 
   /* above color is use to change text  */
   border:none;
   /* height:30px; */
   /* width:130; */
   /* below are some effects better when you want to do for height and width */
   margin-right: 8px;
   margin-left: 20px;
   padding-top: 10px;
   padding-bottom: 10px;
   padding-left: 16px;
   padding-right: 16px;
   transition : opacity 0.15s;
   vertical-align: top;


   border-radius: 2px;
   /* more the pxl  more rounded edges rgb(8, 48, 179) */ 
   cursor: pointer;
   transition:opacity 0.15s;
}

   .subscribe-button:hover {
   opacity:0.8;
   }
    .subscribe-button:active{
     opacity: 0.5;



   }





.JOIN-button{
  background-color : white;
  border-color: rgb(43, 11, 184);
  border-style: solid;
  border-width: 1px;
  color: rgb(43, 11, 184);
  height : 30px;
  width : 62;
  border-radius: 2px;
  cursor: pointer;
  margin-left: 8px;
  transition : background-color 1s,
  color 1s;

}
/* below are when you want to have effect when take cursor  or click tbutton  */
.JOIN-button:hover {
background-color:  rgb(43, 11, 184);
color:white;
}
.JOIN-button:active{

opacity: 0.273;

}




.TWEET{
background-color: rgb(8, 48, 179);
color : white;
border-radius: 40px;
height: 36px;
width : 75px;
border-color:  rgb(8, 48, 179) ;
border-style: solid;
font-weight:bold;
font-size: 13px;
cursor: pointer;
margin-left:9px;
transition: box-shadow 0.19s;
}

.TWEET:hover {
  
  box-shadow : 10px  05px  15px black;
  opacity = 0.05;

}
</STYLE>
<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="JOIN-button">JOIN</button>
<button CLASS="TWEET">TWEET</button>
